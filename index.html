<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title></title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
    cast-media-player, touch-controls, tv-overlay {
      display: none !important;
      visibility: hidden !important;
    }
    #busy {
      position: fixed; inset: 0; z-index: 2; display: none; pointer-events: none;
    }
    #busy.on { display: block; }
    #streamVideo, #streamFrame {
      position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3;
      object-fit: contain; background: #0b0d10; pointer-events: none;
    }
    #streamVideo[hidden], #streamFrame[hidden] { display: none !important; }
    #mark {
      position: fixed; inset: 0; z-index: 4;
      background: #0b0d10;
      display: grid; place-items: center;
      pointer-events: none;
    }
    #mark[hidden] { display: none; }
    #mark .logo {
      width: min(28vh, 220px);
      height: min(28vh, 220px);
      object-fit: contain;
      border-radius: 22%;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    #busy::after {
      content: "";
      position: absolute; left: 50%; top: 50%;
      width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #f2f5f7;
      animation: spsphere-spin 0.8s linear infinite;
    }
    @keyframes spsphere-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <video id="streamVideo" hidden muted autoplay playsinline></video>
  <img id="streamFrame" alt="" hidden>
  <div id="mark" hidden><img class="logo" src="logo.png" alt="" /></div>
  <div id="busy"></div>
  <video id="wakeVideo" muted loop playsinline autoplay width="2" height="2" style="position:fixed;left:-99px;top:-99px;width:2px;height:2px;opacity:0.01;pointer-events:none"></video>
  <script src="player.js?v=20261111.1"></script>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    var NAMESPACE = "urn:x-cast:com.cameron.viewer360";
    var viewCanvas = document.getElementById("view");
    var player = SpsphereCast.create(viewCanvas);
    window.__player = player;
    var aimSocket = null;
    var aimUrl = "";

    function sendLog(message) {
      try {
        if (window.__castSend) window.__castSend({ type: "log", message: String(message) });
      } catch (e) {}
    }

    window.addEventListener("error", function (event) {
      var detail = event && (event.message || (event.error && event.error.message)) || "unknown";
      sendLog("window error: " + detail);
    });
    window.addEventListener("unhandledrejection", function (event) {
      var reason = event && event.reason;
      var detail = reason && (reason.message || String(reason)) || "unknown";
      sendLog("unhandledrejection: " + detail);
    });

    if (viewCanvas && viewCanvas.addEventListener) {
      viewCanvas.addEventListener("webglcontextlost", function (event) {
        if (event && event.preventDefault) event.preventDefault();
        sendLog("webglcontextlost");
      }, false);
      viewCanvas.addEventListener("webglcontextrestored", function () {
        sendLog("webglcontextrestored");
        if (player && player.softReset) player.softReset("webgl-restored");
      }, false);
    }

    function echoCast(seq, ts) {
      try {
        context.sendCustomMessage(NAMESPACE, undefined, { type: "echo", seq: seq, ts: ts });
      } catch (e) {}
    }

    function connectAim(url) {
      var safe = SpsphereCast.acceptAimSocket(url);
      if (!safe || (safe === aimUrl && aimSocket && (aimSocket.readyState === 0 || aimSocket.readyState === 1))) return;
      aimUrl = safe;
      url = safe;
      if (aimSocket) {
        try { aimSocket.close(); } catch (e) {}
        aimSocket = null;
      }
      var socket;
      try {
        socket = new WebSocket(safe);
      } catch (e) {
        return;
      }
      aimSocket = socket;
      socket.binaryType = "arraybuffer";
      socket.onopen = function () {
        if (socket !== aimSocket) return;
        if (player && player.touchAim) player.touchAim(Date.now());
        if (typeof sendLog === "function") sendLog("aim socket open");
      };
      socket.onmessage = function (event) {
        if (socket !== aimSocket) return;
        if (player && player.noteSender) player.noteSender(Date.now());
        if (player && player.touchAim) player.touchAim(Date.now());
        var skip = SpsphereCast.decodeSkip(event.data);
        if (skip) {
          player.skip(skip);
          return;
        }
        var sample = SpsphereCast.decodeAim(event.data);
        if (!sample) return;
        if (player.applyAim(sample) && socket.readyState === 1) {
          socket.send(player.encodeEcho(sample.seq, sample.ts));
          if (player.touchAim) player.touchAim(Date.now());
        }
      };
      socket.onclose = function (event) {
        if (socket !== aimSocket) return;
        aimSocket = null;
        if (typeof sendLog === "function") {
          sendLog(SpsphereCast.socketDisconnectLog("aim", aimUrl, event && event.code, event && event.reason));
        }
        if (aimUrl && player && player.items && player.items.length) {
          setTimeout(function () {
            if (!aimSocket) connectAim(aimUrl);
          }, 600);
        }
      };
    }

    function sendAimKeepalive(now) {
      if (!aimSocket || aimSocket.readyState !== 1 || !player || !player.aimKeepaliveDue) return;
      now = now || Date.now();
      if (!player.aimKeepaliveDue(now)) return;
      try {
        aimSocket.send(player.aimKeepaliveBytes(now));
        if (typeof sendLog === "function") sendLog("aim keepalive");
      } catch (e) {}
    }

    var silentAudioCtx = null;
    var wakeLockSentinel = null;
    var wakeCanvas = null;
    var wakeCtx = null;
    var wakeStream = null;
    var wakeTick = 0;

    function requestScreenWakeLock() {
      try {
        if (navigator && navigator.wakeLock && typeof navigator.wakeLock.request === "function") {
          if (!wakeLockSentinel || wakeLockSentinel.released === true) {
            navigator.wakeLock.request("screen").then(function (sentinel) {
              wakeLockSentinel = sentinel;
            }).catch(function () {});
          }
        }
      } catch (e) {}
    }

    function pumpWakeVideo() {
      try {
        var wakeVideo = document.getElementById("wakeVideo");
        if (!wakeVideo) return;
        if (!wakeCanvas && document.createElement) {
          wakeCanvas = document.createElement("canvas");
          wakeCanvas.width = 2;
          wakeCanvas.height = 2;
          wakeCtx = wakeCanvas.getContext("2d");
        }
        if (wakeCtx) {
          wakeTick = (wakeTick + 1) & 1;
          wakeCtx.fillStyle = wakeTick ? "#0b0d10" : "#0c0e11";
          wakeCtx.fillRect(0, 0, 2, 2);
        }
        if (!wakeStream && wakeCanvas && typeof wakeCanvas.captureStream === "function") {
          wakeStream = wakeCanvas.captureStream(1);
          wakeVideo.srcObject = wakeStream;
        }
        if (wakeVideo.paused && typeof wakeVideo.play === "function") {
          var p = wakeVideo.play();
          if (p && typeof p.catch === "function") p.catch(function () {});
        }
      } catch (e) {}
    }

    function keepReceiverAwake() {
      try {
        if (context && context.setApplicationState) {
          context.setApplicationState("SPSphere 360");
        }
      } catch (e) {}
      requestScreenWakeLock();
      pumpWakeVideo();
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx && !silentAudioCtx) {
          silentAudioCtx = new AudioCtx();
          var osc = silentAudioCtx.createOscillator();
          var gain = silentAudioCtx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(silentAudioCtx.destination);
          osc.start(0);
        }
        if (silentAudioCtx && silentAudioCtx.state === "suspended" && silentAudioCtx.resume) {
          silentAudioCtx.resume();
        }
      } catch (e) {}
    }

    document.addEventListener("visibilitychange", function () {
      var state = document.visibilityState || "unknown";
      sendLog("visibilitychange: " + state);
      if (state === "visible") keepReceiverAwake();
    });

    var streamMode = "";
    var streamCodec = "";
    var streamUrl = "";
    var streamSocket = null;
    var streamSawFrame = false;
    var streamRetries = 0;
    var streamRejected = 0;
    var streamProbeLogged = false;
    var streamQueue = [];
    var streamSource = null;
    var streamBuffer = null;
    var streamFrameLogAt = 0;

    function hideStreamSurface() {
      var video = document.getElementById("streamVideo");
      var frame = document.getElementById("streamFrame");
      if (video) video.hidden = true;
      if (frame) frame.hidden = true;
      if (player) player._streamActive = false;
    }

    function showStreamSurface(which) {
      var video = document.getElementById("streamVideo");
      var frame = document.getElementById("streamFrame");
      if (video) video.hidden = which !== "video";
      if (frame) frame.hidden = which !== "frame";
      if (player) player._streamActive = true;
    }

    function fallbackCanvas(why) {
      hideStreamSurface();
      streamSawFrame = false;
      sendLog("stream fallback canvas2d" + (why ? " " + why : ""));
    }

    function maybeProbeStream() {
      if (!player || !player.wantsPhoneStream || !player.wantsPhoneStream()) return;
      var hasMse = typeof MediaSource !== "undefined";
      var probe = SpsphereCast.streamProbe(false, hasMse);
      if (!probe) return;
      if (!streamProbeLogged) {
        streamProbeLogged = true;
        sendLog(probe.log);
      }
      window.__castSend({
        type: probe.type,
        webgl: probe.webgl,
        mse: probe.mse,
        modes: probe.modes,
        build: probe.build,
      });
    }

    function noteStreamFrame(mode, n) {
      var first = !streamSawFrame;
      streamSawFrame = true;
      streamRetries = 0;
      streamRejected = 0;
      showStreamSurface(mode === "jpeg-ws" ? "frame" : "video");
      var now = Date.now();
      if (first || now - streamFrameLogAt >= 2000) {
        streamFrameLogAt = now;
        sendLog("stream frame " + mode + " bytes=" + n);
      }
    }

    function paintJpeg(bytes) {
      var frame = document.getElementById("streamFrame");
      if (!frame || !window.URL || !URL.createObjectURL) return;
      var blob = new Blob([bytes], { type: "image/jpeg" });
      var url = URL.createObjectURL(blob);
      var prev = frame._streamUrl;
      frame.onload = function () {
        if (prev) { try { URL.revokeObjectURL(prev); } catch (e) {} }
      };
      frame._streamUrl = url;
      frame.src = url;
      noteStreamFrame("jpeg-ws", bytes.length || 0);
    }

    function pumpH264() {
      if (!streamBuffer || streamBuffer.updating || !streamQueue.length) return;
      var next = streamQueue.shift();
      var copy = next.buffer.slice(next.byteOffset, next.byteOffset + next.byteLength);
      try {
        streamBuffer.appendBuffer(copy);
        noteStreamFrame("h264-mse", copy.byteLength);
      } catch (err) {
        if (!streamSawFrame) fallbackCanvas("append");
        else sendLog("stream mse " + (err && err.message ? err.message : "append"));
      }
    }

    function appendH264(bytes) {
      if (typeof MediaSource === "undefined") {
        fallbackCanvas("no-mse");
        return;
      }
      var video = document.getElementById("streamVideo");
      if (!video) return;
      streamQueue.push(bytes);
      if (streamSource) {
        pumpH264();
        return;
      }
      streamSource = new MediaSource();
      video.src = URL.createObjectURL(streamSource);
      streamSource.addEventListener("sourceopen", function () {
        if (streamBuffer || !streamSource || streamSource.readyState !== "open") return;
        var first = streamQueue.length ? streamQueue[0] : null;
        var sniffed = (first && SpsphereCast.codecFromAvcC(first)) || streamCodec || "avc1.42E01E";
        try {
          streamBuffer = streamSource.addSourceBuffer('video/mp4; codecs="' + sniffed + '"');
        } catch (err) {
          sendLog("stream mse " + (err && err.message ? err.message : "open"));
          fallbackCanvas("mse");
          return;
        }
        try { streamBuffer.mode = "sequence"; } catch (err) {}
        streamBuffer.addEventListener("updateend", pumpH264);
        streamBuffer.addEventListener("error", function () {
          if (!streamSawFrame) fallbackCanvas("mse");
        });
        try {
          var playing = video.play();
          if (playing && playing.catch) playing.catch(function () {});
        } catch (err) {}
        pumpH264();
      });
    }

    function onStreamBytes(buffer, mode) {
      var bytes = new Uint8Array(buffer);
      if (mode === "jpeg-ws") {
        if (!SpsphereCast.jpegFrame(bytes)) {
          streamRejected += 1;
          if (streamRejected >= 3 && !streamSawFrame) fallbackCanvas("not-jpeg");
          return;
        }
        paintJpeg(bytes);
        return;
      }
      if (mode === "h264-mse") appendH264(bytes);
    }

    function connectStream(url, mode) {
      var safe = SpsphereCast.acceptStreamSocket(url);
      if (!safe || !mode) return;
      if (player && player.wantsPhoneStream && !player.wantsPhoneStream()) return;
      if (safe === streamUrl && streamSocket && (streamSocket.readyState === 0 || streamSocket.readyState === 1)) return;
      streamUrl = safe;
      streamMode = mode;
      if (streamSocket) {
        var previous = streamSocket;
        streamSocket = null;
        try { previous.close(); } catch (e) {}
      }
      var socket;
      try {
        socket = new WebSocket(safe);
      } catch (e) {
        fallbackCanvas("open");
        return;
      }
      streamSocket = socket;
      socket.binaryType = "arraybuffer";
      socket.onopen = function () {
        if (socket !== streamSocket) return;
        sendLog("stream socket open " + mode);
      };
      socket.onmessage = function (event) {
        if (socket !== streamSocket || !event) return;
        if (event.data instanceof ArrayBuffer) onStreamBytes(event.data, mode);
      };
      socket.onerror = function () {
        if (socket !== streamSocket) return;
        sendLog("stream socket error");
      };
      socket.onclose = function (event) {
        if (socket !== streamSocket) return;
        streamSocket = null;
        sendLog(SpsphereCast.socketDisconnectLog("stream", streamUrl, event && event.code, event && event.reason));
        if (!streamUrl || !streamMode) return;
        if (!streamSawFrame) {
          streamRetries += 1;
          if (streamRetries <= 3) {
            setTimeout(function () {
              if (!streamSocket && streamUrl && streamMode) connectStream(streamUrl, streamMode);
            }, 600);
            return;
          }
          fallbackCanvas("closed");
          return;
        }
        if (player && player.items && player.items.length) {
          setTimeout(function () {
            if (!streamSocket && streamUrl && streamMode) connectStream(streamUrl, streamMode);
          }, 600);
        }
      };
    }

    function acceptStreamChoice(msg) {
      if (!player || !player.wantsPhoneStream || !player.wantsPhoneStream()) {
        sendLog("stream choice ignored webgl=1");
        return;
      }
      var hasMse = typeof MediaSource !== "undefined";
      var choice = SpsphereCast.streamChoose(hasMse, msg || {});
      if (!choice) {
        sendLog("stream choice rejected");
        return;
      }
      streamMode = choice.mode;
      streamCodec = choice.codec || "";
      streamRetries = 0;
      streamRejected = 0;
      sendLog(choice.choiceLog);
      window.__castSend(choice.announce);
      sendLog(choice.announceLog);
      var url = choice.ws || SpsphereCast.streamUrlFromAim(aimUrl);
      if (url) connectStream(url, streamMode);
    }

    function closeReceiver(reason) {
      sendLog("closing receiver: " + (reason || "stop"));
      aimUrl = "";
      streamUrl = "";
      streamMode = "";
      if (aimSocket) {
        try { aimSocket.close(); } catch (e) {}
        aimSocket = null;
      }
      if (streamSocket) {
        try { streamSocket.close(); } catch (e) {}
        streamSocket = null;
      }
      hideStreamSurface();
      try {
        if (wakeVideo && typeof wakeVideo.pause === "function") wakeVideo.pause();
      } catch (e) {}
      player.stop();
      if (window.__idle) window.__idle.stop();
      try {
        if (context && typeof context.stop === "function") context.stop();
      } catch (e) {}
      try {
        if (typeof window.close === "function") window.close();
      } catch (e) {}
    }

    function handle(msg) {
      var accepted = SpsphereCast.acceptCastMessage(msg);
      if (!accepted) return;
      if (player && player.noteSender) player.noteSender(Date.now());
      msg = accepted;
      if (msg instanceof ArrayBuffer) {
        var skipDelta = SpsphereCast.decodeSkip(msg);
        if (skipDelta) {
          player.skip(skipDelta);
          return;
        }
        var binary = SpsphereCast.decodeAim(msg);
        if (binary) player.applyAim(binary);
        return;
      }
      if (!msg || !msg.type) return;
      if (msg.type === "queue") {
        keepReceiverAwake();
        connectAim(msg.ws);
        if (msg.streamMode || msg.stream) {
          acceptStreamChoice({
            mode: msg.streamMode || msg.stream,
            codec: msg.codec,
            ws: msg.streamWs || "",
            streamWs: msg.streamWs || "",
          });
        } else {
          maybeProbeStream();
          if (streamMode) {
            var derived = SpsphereCast.streamUrlFromAim(msg.ws);
            if (derived) connectStream(derived, streamMode);
          }
        }
        player.setSpeed(msg.speed || SpsphereCast.DEFAULT_DPS);
        player.setPace(msg.preload);
        if (msg.fadeMs) player.setSnapFadeMs(msg.fadeMs);
        player.setLan(msg.lan === true);
        var started = player.setQueue(msg.items || []);
        if (started !== false) player.play();
        if (window.__idle) { window.__idle.play(); window.__idle.show(); }
      } else if (msg.type === "append") {
        player.appendItems(msg.items || []);
      } else if (msg.type === "remove") {
        player.removeId(msg.id);
      } else if (msg.type === "move") {
        player.moveId(msg.id, msg.to);
      } else if (msg.type === "goto") {
        player.gotoId(msg.id);
      } else if (msg.type === "play") {
        player.play();
        keepReceiverAwake();
        if (window.__idle) { window.__idle.play(); window.__idle.show(); }
      } else if (msg.type === "pause") {
        player.pause(!!msg.held);
        keepReceiverAwake();
        if (window.__idle) { window.__idle.pause(); window.__idle.show(); }
      } else if (msg.type === "next") {
        player.next();
      } else if (msg.type === "previous") {
        player.previous();
      } else if (msg.type === "stop") {
        closeReceiver("sender-stop");
      } else if (msg.type === "heartbeat" || msg.type === "ping") {
        if (player && player.noteSender) player.noteSender(Date.now());
        if (window.__idle) {
          if (!window.__idle.shown && player.items && player.items.length) window.__idle.show();
          window.__idle.touch();
        }
        window.__castSend({ type: "heartbeat", state: window.__idle ? window.__idle.state : "PLAYING" });
        window.__castSend({ type: "echo", seq: msg.seq || 0, ts: msg.ts || Date.now() });
      } else if (msg.type === "speed") {
        player.setSpeed(msg.speed);
      } else if (msg.type === "aim") {
        if (aimSocket && aimSocket.readyState === 1 && msg.anchor && player.manual && player._anchored && player._lastSeq >= (msg.seq >>> 0)) return;
        if (player.applyAim(msg)) echoCast(msg.seq, msg.ts);
      } else if (msg.type === "chunk") {
        player.noteChunk(msg);
      } else if (msg.type === "fetchError") {
        player.noteFetchError(msg);
      } else if (msg.type === "retile") {
        player.retile(msg.id, msg.item);
        if (msg.ws) connectAim(msg.ws);
        if (msg.ws && streamMode) {
          var streamed = SpsphereCast.streamUrlFromAim(msg.ws);
          if (streamed) connectStream(streamed, streamMode);
        }
      } else if (msg.type === "fov") {
        player.setFov(msg.fov);
      } else if (msg.type === "pace") {
        player.setPace(msg.preload);
      } else if (msg.type === "fade") {
        player.setSnapFadeMs(msg.ms);
      } else if (msg.type === "hello") {
        if (player && player.noteSender) player.noteSender(Date.now());
        keepReceiverAwake();
        sendLimits();
        sendCaps();
        if (player && player.announceBuild) player.announceBuild();
        maybeProbeStream();
        sendLog("receiver ready (hello ack)");
        if (player && player.items && player.items.length) {
          window.__castSend({
            type: "status",
            index: player.index,
            playing: player.playing,
            phase: player.phase,
          });
        }
      } else if (msg.type === "lan") {
        player.setLan(msg.enabled !== false);
      } else if (msg.type === "soft-reset" || msg.type === "softReset") {
        player.softReset("phone", msg.reason);
      } else if (msg.type === "debug") {
        player.setDebugTint(msg.on);
      } else if (msg.type === "stream" || msg.type === "stream-choice") {
        acceptStreamChoice(msg);
      }
    }

    document.addEventListener("keydown", function (event) {
      var info = event.keyCode === 457 || event.keyCode === 165 || event.key === "i" || event.key === "I";
      if (!info) return;
      player.setDebugTint();
    });

    function sendCaps() {
      var caps = player.deviceReport();
      window.__castSend({
        type: "caps",
        deviceMemory: caps.deviceMemory,
        maxTexture: caps.maxTexture,
        renderer: caps.renderer,
        uploadMsPerMb: caps.uploadMsPerMb,
        webgl2: !!caps.webgl2,
      });
    }

    function sendLimits(maxTex) {
      var caps = player.deviceReport();
      sendCaps();
      window.__castSend({ type: "limits", maxTexture: maxTex || caps.maxTexture });
    }

    window.__castHandle = handle;

    window.__onCastStatus = function (snap) {
      try {
        context.sendCustomMessage(NAMESPACE, undefined, {
          type: "status",
          index: snap.index,
          playing: snap.playing,
          phase: snap.phase,
        });
      } catch (e) {}
    };

    var context = cast.framework.CastReceiverContext.getInstance();
    window.__castSend = function (msg) {
      try { context.sendCustomMessage(NAMESPACE, undefined, msg); } catch (e) {}
    };
    if (player && player.announceBuild) player.announceBuild();
    function onCastMessage(event) {
      try { handle(event && event.data); } catch (e) {}
    }
    var startup = SpsphereCast.receiverStartup();
    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = startup.disableIdleTimeout !== false;
    options.maxInactivity = startup.maxInactivity;
    options.customNamespaces = {};
    options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;
    options.skipMplLoad = startup.skipMplLoad;
    context.addCustomMessageListener(NAMESPACE, onCastMessage);
    try {
      var playerManager = context.getPlayerManager();
      window.__playerManager = playerManager;
      if (playerManager && playerManager.setMessageInterceptor && cast.framework.messages && cast.framework.messages.MessageType) {
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.LOAD,
          function () { return null; }
        );
      }
    } catch (e) {}
    try {
      var sysEvents = cast.framework.system && cast.framework.system.EventType;
      if (sysEvents) {
        if (sysEvents.SENDER_CONNECTED) {
          context.addEventListener(sysEvents.SENDER_CONNECTED, function (event) {
            keepReceiverAwake();
            if (player && player.announceBuild) player.announceBuild();
            sendLog("sender connected: " + (event && event.senderId || "unknown"));
          });
        }
        if (sysEvents.SENDER_DISCONNECTED) {
          context.addEventListener(sysEvents.SENDER_DISCONNECTED, function (event) {
            var reason = event && (event.reason || event.senderId) || "unknown";
            sendLog("sender disconnected: " + reason);
            var senders = [];
            try { senders = context.getSenders() || []; } catch (e) {}
            var explicitStop = String(reason).toLowerCase().indexOf("requested_by_sender") >= 0 ||
              (typeof cast !== "undefined" && cast.framework && cast.framework.system &&
               cast.framework.system.DisconnectReason &&
               event && event.reason === cast.framework.system.DisconnectReason.REQUESTED_BY_SENDER);
            if (explicitStop && senders.length === 0) {
              closeReceiver("requested-by-sender");
              return;
            }
            var armed = SpsphereCast.armSenderGrace(
              player._disconnectGrace,
              player._lastSender,
              Date.now(),
              senders.length,
              SpsphereCast.SENDER_TIMEOUT_MS
            );
            if (!player._disconnectGrace && armed) {
              if (player._logSwitch) player._logSwitch("sender-disconnect", "grace");
            }
            player._disconnectGrace = armed;
          });
        }
        if (sysEvents.SHUTDOWN) {
          context.addEventListener(sysEvents.SHUTDOWN, function () {
            sendLog("systemshutdown");
          });
        }
        if (sysEvents.STANDBY_CHANGED) {
          context.addEventListener(sysEvents.STANDBY_CHANGED, function (event) {
            sendLog("standby: " + (event && event.isStandby));
          });
        }
      }
    } catch (e) {}
    context.start(options);
    keepReceiverAwake();
    sendLog("receiver boot " + (SpsphereCast.RECEIVER_BUILD || ""));
    maybeProbeStream();
    window.__idle = new SpsphereCast.IdleGuard(function () { return Date.now(); });
    var lastAppStateAt = Date.now();
    setInterval(function () {
      var now = Date.now();
      if (now - lastAppStateAt >= 15000) {
        lastAppStateAt = now;
        keepReceiverAwake();
      }
      var guard = window.__idle;
      if (!guard) return;
      var activeSenders = [];
      try { activeSenders = (context && context.getSenders && context.getSenders()) || []; } catch (e) {}
      if (activeSenders.length === 0 && player._disconnectGrace && now - player._disconnectGrace > SpsphereCast.SENDER_TIMEOUT_MS) {
        player.onSenderGone("sender-disconnected");
        closeReceiver("sender-disconnected");
        return;
      }
      if (!player.items || !player.items.length) {
        if (player.senderTimedOut(now)) {
          player.onSenderGone("heartbeat-timeout");
          return;
        }
        guard.stop();
        return;
      }
      if (!guard.shown) guard.show();
      if (player.playing) guard.play();
      else guard.pause();
      sendAimKeepalive(now);
      if (player.items && player.items.length && (!player._castKeepaliveAt || now - player._castKeepaliveAt >= 10000)) {
        player._castKeepaliveAt = now;
        window.__castSend({ type: "heartbeat", state: guard.shown ? guard.state : "PLAYING" });
      }
      if (!guard.tick()) return;
      window.__castSend({ type: "heartbeat", state: guard.state });
    }, 1000);
    sendLimits();
    setTimeout(sendLimits, 500);
    setTimeout(sendLimits, 1500);
  </script>
