<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
    cast-media-player, touch-controls, tv-overlay {
      display: none !important;
      visibility: hidden !important;
    }
    #busy {
      position: fixed; inset: 0; z-index: 2; display: none; pointer-events: none;
    }
    #busy.on { display: block; }
    #mark {
      position: fixed; inset: 0; z-index: 4;
      background: #0b0d10;
      display: grid; place-items: center;
      pointer-events: none;
    }
    #mark[hidden] { display: none; }
    #mark .logo {
      width: min(28vh, 220px);
      height: min(28vh, 220px);
      object-fit: contain;
      border-radius: 22%;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    #busy::after {
      content: "";
      position: absolute; left: 50%; top: 50%;
      width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #f2f5f7;
      animation: spsphere-spin 0.8s linear infinite;
    }
    @keyframes spsphere-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="mark" hidden><img class="logo" src="logo.png" alt="" /></div>
  <div id="busy"></div>
  <script src="player.js"></script>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    var NAMESPACE = "urn:x-cast:com.cameron.viewer360";
    var player = SpsphereCast.create(document.getElementById("view"));
    window.__player = player;
    var aimSocket = null;
    var aimUrl = "";

    function echoCast(seq, ts) {
      try {
        context.sendCustomMessage(NAMESPACE, undefined, { type: "echo", seq: seq, ts: ts });
      } catch (e) {}
    }

    function connectAim(url) {
      var safe = SpsphereCast.acceptAimSocket(url);
      if (!safe || safe === aimUrl) return;
      aimUrl = safe;
      url = safe;
      if (aimSocket) {
        try { aimSocket.close(); } catch (e) {}
        aimSocket = null;
      }
      var socket;
      try {
        socket = new WebSocket(safe);
      } catch (e) {
        return;
      }
      aimSocket = socket;
      socket.binaryType = "arraybuffer";
      socket.onmessage = function (event) {
        if (socket !== aimSocket) return;
        if (player && player.noteSender) player.noteSender(Date.now());
        var skip = SpsphereCast.decodeSkip(event.data);
        if (skip) {
          player.skip(skip);
          return;
        }
        var sample = SpsphereCast.decodeAim(event.data);
        if (!sample) return;
        player.applyAim(sample);
        if (socket.readyState === 1) socket.send(player.encodeEcho(sample.seq, sample.ts));
      };
      socket.onclose = function () {
        if (socket === aimSocket) aimSocket = null;
      };
    }

    var silentAudioCtx = null;
    function keepReceiverAwake() {
      try {
        if (context && context.setApplicationState) {
          context.setApplicationState("SPSphere 360");
        }
      } catch (e) {}
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx && !silentAudioCtx) {
          silentAudioCtx = new AudioCtx();
          var osc = silentAudioCtx.createOscillator();
          var gain = silentAudioCtx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(silentAudioCtx.destination);
          osc.start(0);
        }
        if (silentAudioCtx && silentAudioCtx.state === "suspended" && silentAudioCtx.resume) {
          silentAudioCtx.resume();
        }
      } catch (e) {}
    }

    function handle(msg) {
      var accepted = SpsphereCast.acceptCastMessage(msg);
      if (!accepted) return;
      if (player && player.noteSender) player.noteSender(Date.now());
      msg = accepted;
      if (msg instanceof ArrayBuffer) {
        var skipDelta = SpsphereCast.decodeSkip(msg);
        if (skipDelta) {
          player.skip(skipDelta);
          return;
        }
        var binary = SpsphereCast.decodeAim(msg);
        if (binary) player.applyAim(binary);
        return;
      }
      if (!msg || !msg.type) return;
      if (msg.type === "queue") {
        keepReceiverAwake();
        connectAim(msg.ws);
        player.setSpeed(msg.speed || SpsphereCast.DEFAULT_DPS);
        player.setPace(msg.preload);
        if (msg.fadeMs) player.setSnapFadeMs(msg.fadeMs);
        player.setLan(msg.lan === true);
        var started = player.setQueue(msg.items || []);
        if (started !== false) player.play();
        if (window.__idle) { window.__idle.play(); window.__idle.show(); }
      } else if (msg.type === "append") {
        player.appendItems(msg.items || []);
      } else if (msg.type === "remove") {
        player.removeId(msg.id);
      } else if (msg.type === "move") {
        player.moveId(msg.id, msg.to);
      } else if (msg.type === "goto") {
        player.gotoId(msg.id);
      } else if (msg.type === "play") {
        player.play();
        keepReceiverAwake();
        if (window.__idle) { window.__idle.play(); window.__idle.show(); }
      } else if (msg.type === "pause") {
        player.pause(!!msg.held);
        keepReceiverAwake();
        if (window.__idle) { window.__idle.pause(); window.__idle.show(); }
      } else if (msg.type === "next") {
        player.next();
      } else if (msg.type === "previous") {
        player.previous();
      } else if (msg.type === "stop") {
        player.stop();
        if (window.__idle) window.__idle.stop();
      } else if (msg.type === "heartbeat" || msg.type === "ping") {
        if (player && player.noteSender) player.noteSender(Date.now());
        if (window.__idle) {
          if (!window.__idle.shown && player.items && player.items.length) window.__idle.show();
          window.__idle.touch();
        }
        window.__castSend({ type: "heartbeat", state: window.__idle ? window.__idle.state : "PLAYING" });
        window.__castSend({ type: "echo", seq: msg.seq || 0, ts: msg.ts || Date.now() });
      } else if (msg.type === "speed") {
        player.setSpeed(msg.speed);
      } else if (msg.type === "aim") {
        if (player.applyAim(msg)) echoCast(msg.seq, msg.ts);
      } else if (msg.type === "chunk") {
        player.noteChunk(msg);
      } else if (msg.type === "fetchError") {
        player.noteFetchError(msg);
      } else if (msg.type === "retile") {
        player.retile(msg.id, msg.item);
      } else if (msg.type === "fov") {
        player.setFov(msg.fov);
      } else if (msg.type === "pace") {
        player.setPace(msg.preload);
      } else if (msg.type === "fade") {
        player.setSnapFadeMs(msg.ms);
      } else if (msg.type === "hello") {
        if (player && player.noteSender) player.noteSender(Date.now());
        sendLimits();
        sendCaps();
        if (player && player.items && player.items.length) {
          window.__castSend({
            type: "status",
            index: player.index,
            playing: player.playing,
            phase: player.phase,
          });
        }
      } else if (msg.type === "lan") {
        player.setLan(msg.enabled !== false);
      } else if (msg.type === "soft-reset" || msg.type === "softReset") {
        player.softReset(msg.reason || "phone");
      } else if (msg.type === "debug") {
        player.setDebugTint(msg.on);
      }
    }

    document.addEventListener("keydown", function (event) {
      var info = event.keyCode === 457 || event.keyCode === 165 || event.key === "i" || event.key === "I";
      if (!info) return;
      player.setDebugTint();
    });

    function sendCaps() {
      var caps = player.deviceReport();
      window.__castSend({
        type: "caps",
        deviceMemory: caps.deviceMemory,
        maxTexture: caps.maxTexture,
        renderer: caps.renderer,
        uploadMsPerMb: caps.uploadMsPerMb,
        webgl2: !!caps.webgl2,
      });
    }

    function sendLimits(maxTex) {
      var caps = player.deviceReport();
      sendCaps();
      window.__castSend({ type: "limits", maxTexture: maxTex || caps.maxTexture });
    }

    window.__castHandle = handle;

    window.__onCastStatus = function (snap) {
      try {
        context.sendCustomMessage(NAMESPACE, undefined, {
          type: "status",
          index: snap.index,
          playing: snap.playing,
          phase: snap.phase,
        });
      } catch (e) {}
    };

    var context = cast.framework.CastReceiverContext.getInstance();
    window.__castSend = function (msg) {
      try { context.sendCustomMessage(NAMESPACE, undefined, msg); } catch (e) {}
    };
    function onCastMessage(event) {
      try { handle(event && event.data); } catch (e) {}
    }
    var startup = SpsphereCast.receiverStartup();
    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.maxInactivity = 86400;
    options.customNamespaces = {};
    options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;
    options.skipMplLoad = startup.skipMplLoad;
    context.addCustomMessageListener(NAMESPACE, onCastMessage);
    try {
      var playerManager = context.getPlayerManager();
      window.__playerManager = playerManager;
      if (playerManager && playerManager.setMessageInterceptor && cast.framework.messages && cast.framework.messages.MessageType) {
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.LOAD,
          function () { return null; }
        );
      }
    } catch (e) {}
    try {
      context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, function () {
        var senders = [];
        try { senders = context.getSenders() || []; } catch (e) {}
        var armed = SpsphereCast.armSenderGrace(
          player._disconnectGrace,
          player._lastSender,
          Date.now(),
          senders.length,
          SpsphereCast.SENDER_TIMEOUT_MS
        );
        if (!player._disconnectGrace && armed) {
          if (player._logSwitch) player._logSwitch("sender-disconnect", "grace");
        }
        player._disconnectGrace = armed;
      });
    } catch (e) {}
    context.start(options);
    keepReceiverAwake();
    window.__idle = new SpsphereCast.IdleGuard(function () { return Date.now(); });
    var lastAppStateAt = Date.now();
    setInterval(function () {
      var now = Date.now();
      if (now - lastAppStateAt >= 30000) {
        lastAppStateAt = now;
        keepReceiverAwake();
      }
      var guard = window.__idle;
      if (!guard) return;
      if (!player.items || !player.items.length) {
        if (player._disconnectGrace && now - player._disconnectGrace > SpsphereCast.SENDER_TIMEOUT_MS) {
          player.onSenderGone("sender-disconnected");
          return;
        }
        if (player.senderTimedOut(now)) {
          player.onSenderGone("heartbeat-timeout");
          return;
        }
        guard.stop();
        return;
      }
      if (!guard.shown) guard.show();
      if (player.playing) guard.play();
      else guard.pause();
      if (!guard.tick()) return;
      window.__castSend({ type: "heartbeat", state: guard.state });
    }, 1000);
    sendLimits();
    setTimeout(sendLimits, 500);
    setTimeout(sendLimits, 1500);
  </script>
</body>
</html>
