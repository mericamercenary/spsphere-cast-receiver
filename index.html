<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title></title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
    cast-media-player, touch-controls, tv-overlay {
      display: none !important;
      visibility: hidden !important;
    }
    #busy {
      position: fixed; inset: 0; z-index: 2; display: none; pointer-events: none;
    }
    #busy.on { display: block; }
    #streamHold {
      position: fixed; inset: 0; z-index: 2; display: none; pointer-events: none;
      background: transparent;
    }
    #streamHold.on { display: block; }
    #streamHold.on::after {
      content: "";
      position: absolute; left: 50%; top: 50%;
      width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #f2f5f7;
      animation: spsphere-spin 0.8s linear infinite;
    }
    #streamFrame {
      position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3;
      object-fit: contain; background: #0b0d10; pointer-events: none;
    }
    #streamFrame[hidden] { display: none !important; }
    /* Under the canvas, in layout, so a debug H.264 decoder has a real surface. */
    #streamVideo.stream-live {
      position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0;
      opacity: 1; display: block; visibility: visible;
      object-fit: contain; background: #000; pointer-events: none;
    }
    #mark {
      position: fixed; inset: 0; z-index: 4;
      background: #0b0d10;
      display: grid; place-items: center;
      pointer-events: none;
    }
    #mark[hidden] { display: none; }
    #mark .logo {
      width: min(28vh, 220px);
      height: min(28vh, 220px);
      object-fit: contain;
      border-radius: 22%;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    #busy::after {
      content: "";
      position: absolute; left: 50%; top: 50%;
      width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #f2f5f7;
      animation: spsphere-spin 0.8s linear infinite;
    }
    @keyframes spsphere-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="streamHold"></div>
  <canvas id="streamFrame" hidden></canvas>
  <div id="mark" hidden><img class="logo" src="logo.png" alt="" /></div>
  <div id="busy"></div>
  <video id="wakeVideo" muted loop playsinline autoplay width="2" height="2" style="position:fixed;left:-99px;top:-99px;width:2px;height:2px;opacity:0.01;pointer-events:none"></video>
  <script src="player.js?v=20261111.9"></script>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    var NAMESPACE = "urn:x-cast:com.cameron.viewer360";
    var viewCanvas = document.getElementById("view");
    var player = SpsphereCast.create(viewCanvas);
    window.__player = player;
    var aimSocket = null;
    var aimUrl = "";

    function sendLog(message) {
      try {
        if (window.__castSend) window.__castSend({ type: "log", message: String(message) });
      } catch (e) {}
    }

    window.addEventListener("error", function (event) {
      var detail = event && (event.message || (event.error && event.error.message)) || "unknown";
      sendLog("window error: " + detail);
    });
    window.addEventListener("unhandledrejection", function (event) {
      var reason = event && event.reason;
      var detail = reason && (reason.message || String(reason)) || "unknown";
      sendLog("unhandledrejection: " + detail);
    });

    if (viewCanvas && viewCanvas.addEventListener) {
      viewCanvas.addEventListener("webglcontextlost", function (event) {
        if (event && event.preventDefault) event.preventDefault();
        sendLog("webglcontextlost");
      }, false);
      viewCanvas.addEventListener("webglcontextrestored", function () {
        sendLog("webglcontextrestored");
        if (player && player.softReset) player.softReset("webgl-restored");
      }, false);
    }

    function echoCast(seq, ts) {
      try {
        context.sendCustomMessage(NAMESPACE, undefined, { type: "echo", seq: seq, ts: ts });
      } catch (e) {}
    }

    function connectAim(url) {
      var safe = SpsphereCast.acceptAimSocket(url);
      if (!safe || (safe === aimUrl && aimSocket && (aimSocket.readyState === 0 || aimSocket.readyState === 1))) return;
      aimUrl = safe;
      url = safe;
      if (aimSocket) {
        try { aimSocket.close(); } catch (e) {}
        aimSocket = null;
      }
      var socket;
      try {
        socket = new WebSocket(safe);
      } catch (e) {
        return;
      }
      aimSocket = socket;
      socket.binaryType = "arraybuffer";
      socket.onopen = function () {
        if (socket !== aimSocket) return;
        if (player && player.touchAim) player.touchAim(Date.now());
        if (typeof sendLog === "function") sendLog("aim socket open");
      };
      socket.onmessage = function (event) {
        if (socket !== aimSocket) return;
        if (player && player.noteSender) player.noteSender(Date.now());
        if (player && player.touchAim) player.touchAim(Date.now());
        var skip = SpsphereCast.decodeSkip(event.data);
        if (skip) {
          player.skip(skip);
          return;
        }
        var sample = SpsphereCast.decodeAim(event.data);
        if (!sample) return;
        if (player.applyAim(sample) && socket.readyState === 1) {
          socket.send(player.encodeEcho(sample.seq, sample.ts));
          if (player.touchAim) player.touchAim(Date.now());
        }
      };
      socket.onclose = function (event) {
        if (socket !== aimSocket) return;
        aimSocket = null;
        if (typeof sendLog === "function") {
          sendLog(SpsphereCast.socketDisconnectLog("aim", aimUrl, event && event.code, event && event.reason));
        }
        if (aimUrl && player && player.items && player.items.length) {
          setTimeout(function () {
            if (!aimSocket) connectAim(aimUrl);
          }, 600);
        }
      };
    }

    function sendAimKeepalive(now) {
      if (!aimSocket || aimSocket.readyState !== 1 || !player || !player.aimKeepaliveDue) return;
      now = now || Date.now();
      if (!player.aimKeepaliveDue(now)) return;
      try {
        aimSocket.send(player.aimKeepaliveBytes(now));
        if (typeof sendLog === "function") sendLog("aim keepalive");
      } catch (e) {}
    }

    var silentAudioCtx = null;
    var wakeLockSentinel = null;
    var wakeCanvas = null;
    var wakeCtx = null;
    var wakeStream = null;
    var wakeTick = 0;

    function requestScreenWakeLock() {
      try {
        if (navigator && navigator.wakeLock && typeof navigator.wakeLock.request === "function") {
          if (!wakeLockSentinel || wakeLockSentinel.released === true) {
            navigator.wakeLock.request("screen").then(function (sentinel) {
              wakeLockSentinel = sentinel;
            }).catch(function () {});
          }
        }
      } catch (e) {}
    }

    function pumpWakeVideo() {
      try {
        var wakeVideo = document.getElementById("wakeVideo");
        if (!wakeVideo) return;
        if (!wakeCanvas && document.createElement) {
          wakeCanvas = document.createElement("canvas");
          wakeCanvas.width = 2;
          wakeCanvas.height = 2;
          wakeCtx = wakeCanvas.getContext("2d");
        }
        if (wakeCtx) {
          wakeTick = (wakeTick + 1) & 1;
          wakeCtx.fillStyle = wakeTick ? "#0b0d10" : "#0c0e11";
          wakeCtx.fillRect(0, 0, 2, 2);
        }
        if (!wakeStream && wakeCanvas && typeof wakeCanvas.captureStream === "function") {
          wakeStream = wakeCanvas.captureStream(1);
          wakeVideo.srcObject = wakeStream;
        }
        if (wakeVideo.paused && typeof wakeVideo.play === "function") {
          var p = wakeVideo.play();
          if (p && typeof p.catch === "function") p.catch(function () {});
        }
      } catch (e) {}
    }

    function keepReceiverAwake() {
      try {
        if (context && context.setApplicationState) {
          context.setApplicationState("SPSphere 360");
        }
      } catch (e) {}
      requestScreenWakeLock();
      pumpWakeVideo();
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx && !silentAudioCtx) {
          silentAudioCtx = new AudioCtx();
          var osc = silentAudioCtx.createOscillator();
          var gain = silentAudioCtx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(silentAudioCtx.destination);
          osc.start(0);
        }
        if (silentAudioCtx && silentAudioCtx.state === "suspended" && silentAudioCtx.resume) {
          silentAudioCtx.resume();
        }
      } catch (e) {}
    }

    document.addEventListener("visibilitychange", function () {
      var state = document.visibilityState || "unknown";
      sendLog("visibilitychange: " + state);
      if (state === "visible") keepReceiverAwake();
    });

    var streamMode = "";
    var streamDecodeMode = "";
    var streamCodec = "";
    var streamUrl = "";
    var streamSocket = null;
    var streamSawFrame = false;
    var streamRetries = 0;
    var streamRejected = 0;
    var streamProbeLogged = false;
    var streamQueue = [];
    var streamSource = null;
    var streamBuffer = null;
    var streamFrameLogAt = 0;
    var streamWaitTimer = 0;
    var streamReplacing = false;
    var streamLogged = {};
    var streamMseStopped = false;
    var streamMseRebuilds = 0;
    var streamMseRelease = false;
    var streamMseHandling = false;
    var streamNeedInit = false;
    var streamPresenting = false;
    var streamCarry = null;
    var streamSampleN = 0;
    var streamH264Blocked = false;
    var streamRenderFallbackSent = false;
    var streamVideoTornDown = false;
    var streamObjectUrl = "";
    var jpegPending = null;
    var jpegDecoding = false;
    var jpegBitmap = null;
    var jpegDecodeSamples = [];
    var jpegPresented = 0;
    var jpegDropped = 0;
    var jpegStatAt = 0;
    var jpegRaf = 0;
    var jpegFramePose = null;
    var jpegViewW = 0;
    var jpegViewH = 0;
    var jpegWorker = undefined;
    var jpegJob = 0;
    var jpegSeq = 0;
    var jpegJobStarted = 0;
    var jpegJobPose = null;
    var jpegPendingPose = null;
    var jpegIntervals = [];
    var jpegShifts = [];
    var jpegLastRaf = 0;
    var STREAM_WAIT_MS = 5000;

    function hideStreamSurface() {
      var video = document.getElementById("streamVideo");
      var frame = document.getElementById("streamFrame");
      var hold = document.getElementById("streamHold");
      if (video) video.hidden = true;
      if (frame) frame.hidden = true;
      if (hold) hold.className = "";
      if (player) {
        player._streamActive = false;
        player._streamHold = false;
      }
    }

    function holdForStream() {
      if (streamWaitTimer) clearTimeout(streamWaitTimer);
      if (player) {
        player._streamHold = true;
        player._streamHoldPainted = false;
        if (!streamSawFrame) player._streamActive = false;
      }
      var hold = document.getElementById("streamHold");
      if (hold) hold.className = "on";
      streamWaitTimer = setTimeout(function () {
        streamWaitTimer = 0;
        if (streamPresenting || streamSawFrame || !streamMode) return;
        if (streamMode === "h264-mse") {
          onMseBroken("timeout");
          return;
        }
        fallbackCanvas("timeout");
      }, STREAM_WAIT_MS);
    }

    function showStreamSurface(which) {
      var video = document.getElementById("streamVideo");
      var frame = document.getElementById("streamFrame");
      var hold = document.getElementById("streamHold");
      if (video) {
        if (video.className === "stream-live") video.hidden = false;
        else video.hidden = which !== "video";
      }
      if (frame) {
        frame.hidden = which !== "frame";
        if (which === "frame") noteJpegSurface();
      }
      if (hold) hold.className = "";
      if (streamWaitTimer) {
        clearTimeout(streamWaitTimer);
        streamWaitTimer = 0;
      }
      if (player) {
        player._streamHold = false;
        player._streamActive = true;
      }
    }

    function fallbackCanvas(why) {
      if (streamWaitTimer) {
        clearTimeout(streamWaitTimer);
        streamWaitTimer = 0;
      }
      hideStreamSurface();
      streamSawFrame = false;
      closeJpegBitmap();
      sendLog("stream fallback canvas2d" + (why ? " " + why : ""));
    }

    function reportStreamFallback(reason) {
      var why = String(reason || "mse");
      try {
        window.__castSend({ type: "stream-fallback", reason: why });
      } catch (e) {}
      sendLog("stream-fallback " + why);
    }

    function releaseMse() {
      streamQueue = [];
      streamBuffer = null;
      var source = streamSource;
      streamSource = null;
      streamCarry = null;
      if (source) {
        try {
          if (source.readyState === "open") source.endOfStream();
        } catch (e) {}
      }
      var video = document.getElementById("streamVideo");
      if (video) {
        video._ignoreError = true;
        try {
          video.removeAttribute("src");
          if (video.load) video.load();
        } catch (e) {}
      }
    }

    function maybeProbeStream() {
      if (!player || !player.wantsPhoneStream || !player.wantsPhoneStream()) return;
      var hasMse = typeof MediaSource !== "undefined";
      var experiment = false;
      try { experiment = !!SpsphereCast.spsH264Debug(); } catch (err) {}
      var probe = SpsphereCast.streamProbe(false, hasMse, experiment);
      if (!probe) return;
      if (!streamProbeLogged) {
        streamProbeLogged = true;
        sendLog(probe.log);
      }
      window.__castSend({
        type: probe.type,
        webgl: probe.webgl,
        mse: probe.mse,
        modes: probe.modes,
        maxW: probe.maxW,
        maxH: probe.maxH,
        h264: probe.h264,
        build: probe.build,
      });
    }

    function logStreamOnce(key, message) {
      if (streamLogged[key]) return;
      streamLogged[key] = true;
      sendLog(message);
    }

    function noteStreamFrame(mode, n) {
      var first = !streamSawFrame;
      streamSawFrame = true;
      streamRetries = 0;
      streamRejected = 0;
      showStreamSurface(mode === "jpeg-ws" ? "frame" : "video");
      var now = Date.now();
      if (first || now - streamFrameLogAt >= 2000) {
        streamFrameLogAt = now;
        sendLog("stream frame " + mode + " bytes=" + n);
      }
    }

    function bufferedText() {
      try {
        if (!streamBuffer || !streamBuffer.buffered) return "none";
        var parts = [];
        for (var i = 0; i < streamBuffer.buffered.length; i++) {
          parts.push(streamBuffer.buffered.start(i).toFixed(2) + "-" + streamBuffer.buffered.end(i).toFixed(2));
        }
        return parts.join(",") || "empty";
      } catch (err) {
        return "detached";
      }
    }

    function mseAlive() {
      if (streamMseStopped || streamMseRelease || !streamBuffer || !streamSource) return false;
      if (streamSource.readyState !== "open") return false;
      return true;
    }

    function pinLiveEdge() {
      var video = document.getElementById("streamVideo");
      if (!video || !streamBuffer || streamBuffer.updating || !streamBuffer.buffered || !streamBuffer.buffered.length) return;
      var end = streamBuffer.buffered.end(streamBuffer.buffered.length - 1);
      if (!(end > 0.2)) return;
      if (video.currentTime < end - 0.5 || video.currentTime > end) {
        try { video.currentTime = Math.max(0, end - 0.12); } catch (err) {}
      }
    }

    function trimStreamBuffer() {
      if (!streamBuffer || streamBuffer.updating || !streamBuffer.buffered || !streamBuffer.buffered.length) return false;
      var start = streamBuffer.buffered.start(0);
      var end = streamBuffer.buffered.end(streamBuffer.buffered.length - 1);
      if (end - start < 6) return false;
      try {
        streamBuffer.remove(start, end - 2);
        logStreamOnce("trim", "stream mse trim buffered=" + start.toFixed(2) + "-" + end.toFixed(2));
        return true;
      } catch (err) {
        return false;
      }
    }

    function streamDeviceId() {
      var w = 0;
      var h = 0;
      var ua = "";
      try {
        if (window.screen) {
          w = screen.width || 0;
          h = screen.height || 0;
        }
      } catch (err) {}
      try { ua = navigator.userAgent || ""; } catch (err) {}
      return String(w) + "x" + String(h) + "." + ua;
    }

    function ensureH264Block() {
      if (streamH264Blocked) return true;
      try {
        var raw = localStorage.getItem(SpsphereCast.h264BlockKey(streamDeviceId()));
        if (SpsphereCast.h264Blocked(raw)) streamH264Blocked = true;
      } catch (err) {}
      return streamH264Blocked;
    }

    function rememberH264Block() {
      streamH264Blocked = true;
      try {
        localStorage.setItem(
          SpsphereCast.h264BlockKey(streamDeviceId()),
          JSON.stringify(SpsphereCast.h264BlockRecord("video-render"))
        );
      } catch (err) {}
    }

    function logVideoRenderState(video, code, message) {
      var cssW = "";
      var cssH = "";
      var visibility = "";
      var display = "";
      var boxW = 0;
      var boxH = 0;
      var inDom = 0;
      try {
        if (video && video.getBoundingClientRect) {
          var rect = video.getBoundingClientRect();
          boxW = Math.round(rect.width || 0);
          boxH = Math.round(rect.height || 0);
        }
        if (window.getComputedStyle && video) {
          var css = getComputedStyle(video);
          cssW = css.width || "";
          cssH = css.height || "";
          visibility = css.visibility || "";
          display = css.display || "";
        }
        if (video && document.documentElement && document.documentElement.contains && document.documentElement.contains(video)) inDom = 1;
      } catch (err) {}
      logStreamOnce("video-render-state", "stream video error code=" + (code != null ? code : "")
        + " message=" + (message || "")
        + " size=" + ((video && video.videoWidth) || 0) + "x" + ((video && video.videoHeight) || 0)
        + " css=" + cssW + "x" + cssH
        + " box=" + boxW + "x" + boxH
        + " visibility=" + visibility
        + " display=" + display
        + " hidden=" + (video && video.hidden ? 1 : 0)
        + " inDom=" + inDom
        + " readyState=" + (video && video.readyState != null ? video.readyState : "")
        + " networkState=" + (video && video.networkState != null ? video.networkState : ""));
    }

    function logBaselineSupport() {
      function ok(codec) {
        try {
          if (!window.MediaSource || !MediaSource.isTypeSupported) return 0;
          return MediaSource.isTypeSupported('video/mp4; codecs="' + codec + '"') ? 1 : 0;
        } catch (err) {
          return 0;
        }
      }
      logStreamOnce("baseline-support", "stream mse supported avc1.42E01E=" + ok("avc1.42E01E")
        + " avc1.42001F=" + ok("avc1.42001F")
        + " avc1.42801F=" + ok("avc1.42801F"));
    }

    function tearDownVideo() {
      if (streamVideoTornDown) return;
      streamVideoTornDown = true;
      streamMseRelease = true;
      streamMseStopped = true;
      streamQueue = [];
      streamBuffer = null;
      streamSource = null;
      var video = null;
      try { video = document.getElementById("streamVideo"); } catch (err) {}
      var url = streamObjectUrl;
      streamObjectUrl = "";
      try {
        if (video) {
          video._ignoreError = true;
          video.onerror = null;
          video.hidden = true;
          video.removeAttribute("src");
        }
      } catch (err) {}
      try { if (video && video.load) video.load(); } catch (err) {}
      try { if (url && window.URL && URL.revokeObjectURL) URL.revokeObjectURL(url); } catch (err) {}
      try { if (video && video.parentNode) video.parentNode.removeChild(video); } catch (err) {}
      streamMseRelease = false;
    }

    function fallbackVideoRender(why) {
      if (streamRenderFallbackSent) return;
      streamRenderFallbackSent = true;
      streamH264Blocked = true;
      streamMseStopped = true;
      streamQueue = [];
      streamPresenting = false;
      streamSawFrame = false;
      streamRejected = 0;
      streamMode = "jpeg-ws";
      streamDecodeMode = "jpeg-ws";
      try { rememberH264Block(); } catch (err) {}
      try { window.__castSend({ type: "stream-fallback", reason: "video-render" }); } catch (err) {}
      try { sendLog("stream-fallback video-render"); } catch (err) {}
      try { sendLog("stream mse skip-reset " + (why || "video-error")); } catch (err) {}
      try {
        if (player) {
          player._streamActive = false;
          player._streamHold = true;
          player._streamHoldPainted = false;
        }
        var hold = document.getElementById("streamHold");
        if (hold) hold.className = "on";
      } catch (err) {}
      try { holdForStream(); } catch (err) {}
      setTimeout(function () {
        try { tearDownVideo(); } catch (err) {}
      }, 0);
    }

    function onMseBroken(why) {
      if (streamRenderFallbackSent || streamMseRelease || streamMseHandling) return;
      if (streamMode !== "h264-mse" && streamDecodeMode !== "h264-mse") return;
      var video = null;
      try { video = document.getElementById("streamVideo"); } catch (err) {}
      if (why === "video-error" || SpsphereCast.isVideoRenderFailure(video && video.error && video.error.code, (video && video.error && video.error.message) || why)) {
        try { logVideoRenderState(video, video && video.error && video.error.code, video && video.error && video.error.message); } catch (err) {}
        try { logBaselineSupport(); } catch (err) {}
        fallbackVideoRender(why);
        return;
      }
      streamMseHandling = true;
      streamMseStopped = true;
      streamQueue = [];
      streamPresenting = false;
      streamSawFrame = false;
      var video = document.getElementById("streamVideo");
      if (video) video.hidden = true;
      if (player) {
        player._streamActive = false;
        player._streamHold = true;
        player._streamHoldPainted = false;
      }
      var hold = document.getElementById("streamHold");
      if (hold) hold.className = "on";
      var step = SpsphereCast.mseFailureAction(streamMseRebuilds);
      if (step.action === "reset") {
        streamMseRebuilds += 1;
        logStreamOnce("reset-" + why, "stream mse reset " + why + " readyState=" + (streamSource && streamSource.readyState) + " buffered=" + bufferedText());
        try { window.__castSend(step.message); } catch (err) {}
        sendLog("stream-reset max=" + step.message.maxW + "x" + step.message.maxH);
        streamMseRelease = true;
        releaseMse();
        streamMseRelease = false;
        streamMseStopped = false;
        streamNeedInit = true;
        streamMseHandling = false;
        holdForStream();
        return;
      }
      streamMseRelease = true;
      releaseMse();
      streamMseRelease = false;
      streamMode = "jpeg-ws";
      streamDecodeMode = "jpeg-ws";
      streamMseStopped = false;
      streamMseHandling = false;
      reportStreamFallback("mse-decode");
      holdForStream();
    }

    function closeJpegBitmap(bitmap) {
      if (bitmap && bitmap.close) {
        try { bitmap.close(); } catch (err) {}
      }
    }

    function jpegPercentile(samples, p) {
      if (!samples.length) return 0;
      var sorted = samples.slice().sort(function (a, b) { return a - b; });
      var index = Math.ceil(p * sorted.length) - 1;
      if (index < 0) index = 0;
      if (index >= sorted.length) index = sorted.length - 1;
      return sorted[index];
    }

    function noteJpegSurface() {
      var canvas = document.getElementById("streamFrame");
      var ratio = window.devicePixelRatio || 1;
      var cssW = window.innerWidth || 1280;
      var cssH = window.innerHeight || 720;
      var w = Math.max(2, Math.round(cssW * ratio));
      var h = Math.max(2, Math.round(cssH * ratio));
      jpegViewW = w;

            playing: player.playing,
            phase: player.phase,
          });
        }
      } else if (msg.type === "lan") {
        player.setLan(msg.enabled !== false);
      } else if (msg.type === "soft-reset" || msg.type === "softReset") {
        player.softReset("phone", msg.reason);
      } else if (msg.type === "debug") {
        player.setDebugTint(msg.on);
      } else if (msg.type === "stream" || msg.type === "stream-choice") {
        acceptStreamChoice(msg);
      }
    }

    document.addEventListener("keydown", function (event) {
      var info = event.keyCode === 457 || event.keyCode === 165 || event.key === "i" || event.key === "I";
      if (!info) return;
      player.setDebugTint();
    });

    function sendCaps() {
      var caps = player.deviceReport();
      window.__castSend({
        type: "caps",
        deviceMemory: caps.deviceMemory,
        maxTexture: caps.maxTexture,
        renderer: caps.renderer,
        uploadMsPerMb: caps.uploadMsPerMb,
        webgl2: !!caps.webgl2,
      });
    }

    function sendLimits(maxTex) {
      var caps = player.deviceReport();
      sendCaps();
      window.__castSend({ type: "limits", maxTexture: maxTex || caps.maxTexture });
    }

    window.__castHandle = handle;

    window.__onCastStatus = function (snap) {
      try {
        context.sendCustomMessage(NAMESPACE, undefined, {
          type: "status",
          index: snap.index,
          playing: snap.playing,
          phase: snap.phase,
        });
      } catch (e) {}
    };

    var context = cast.framework.CastReceiverContext.getInstance();
    window.__castSend = function (msg) {
      try { context.sendCustomMessage(NAMESPACE, undefined, msg); } catch (e) {}
    };
    if (player && player.announceBuild) player.announceBuild();
    function onCastMessage(event) {
      try { handle(event && event.data); } catch (e) {}
    }
    var startup = SpsphereCast.receiverStartup();
    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = startup.disableIdleTimeout !== false;
    options.maxInactivity = startup.maxInactivity;
    options.customNamespaces = {};
    options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;
    options.skipMplLoad = startup.skipMplLoad;
    context.addCustomMessageListener(NAMESPACE, onCastMessage);
    try {
      var playerManager = context.getPlayerManager();
      window.__playerManager = playerManager;
      if (playerManager && playerManager.setMessageInterceptor && cast.framework.messages && cast.framework.messages.MessageType) {
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.LOAD,
          function () { return null; }
        );
      }
    } catch (e) {}
    try {
      var sysEvents = cast.framework.system && cast.framework.system.EventType;
      if (sysEvents) {
        if (sysEvents.SENDER_CONNECTED) {
          context.addEventListener(sysEvents.SENDER_CONNECTED, function (event) {
            keepReceiverAwake();
            if (player && player.announceBuild) player.announceBuild(true);
            sendLog("sender connected: " + (event && event.senderId || "unknown"));
          });
        }
        if (sysEvents.SENDER_DISCONNECTED) {
          context.addEventListener(sysEvents.SENDER_DISCONNECTED, function (event) {
            var reason = event && (event.reason || event.senderId) || "unknown";
            sendLog("sender disconnected: " + reason);
            var senders = [];
            try { senders = context.getSenders() || []; } catch (e) {}
            var explicitStop = String(reason).toLowerCase().indexOf("requested_by_sender") >= 0 ||
              (typeof cast !== "undefined" && cast.framework && cast.framework.system &&
               cast.framework.system.DisconnectReason &&
               event && event.reason === cast.framework.system.DisconnectReason.REQUESTED_BY_SENDER);
            if (explicitStop && senders.length === 0) {
              closeReceiver("requested-by-sender");
              return;
            }
            var armed = SpsphereCast.armSenderGrace(
              player._disconnectGrace,
              player._lastSender,
              Date.now(),
              senders.length,
              SpsphereCast.SENDER_TIMEOUT_MS
            );
            if (!player._disconnectGrace && armed) {
              if (player._logSwitch) player._logSwitch("sender-disconnect", "grace");
            }
            player._disconnectGrace = armed;
          });
        }
        if (sysEvents.SHUTDOWN) {
          context.addEventListener(sysEvents.SHUTDOWN, function () {
            sendLog("systemshutdown");
          });
        }
        if (sysEvents.STANDBY_CHANGED) {
          context.addEventListener(sysEvents.STANDBY_CHANGED, function (event) {
            sendLog("standby: " + (event && event.isStandby));
          });
        }
      }
    } catch (e) {}
    context.start(options);
    keepReceiverAwake();
    sendLog("receiver boot " + (SpsphereCast.RECEIVER_BUILD || ""));
    maybeProbeStream();
    window.__idle = new SpsphereCast.IdleGuard(function () { return Date.now(); });
    var lastAppStateAt = Date.now();
    setInterval(function () {
      var now = Date.now();
      if (now - lastAppStateAt >= 15000) {
        lastAppStateAt = now;
        keepReceiverAwake();
      }
      var guard = window.__idle;
      if (!guard) return;
      var activeSenders = [];
      try { activeSenders = (context && context.getSenders && context.getSenders()) || []; } catch (e) {}
      if (activeSenders.length === 0 && player._disconnectGrace && now - player._disconnectGrace > SpsphereCast.SENDER_TIMEOUT_MS) {
        player.onSenderGone("sender-disconnected");
        closeReceiver("sender-disconnected");
        return;
      }
      if (!player.items || !player.items.length) {
        if (player.senderTimedOut(now)) {
          player.onSenderGone("heartbeat-timeout");
          return;
        }
        guard.stop();
        return;
      }
      if (!guard.shown) guard.show();
      if (player.playing) guard.play();
      else guard.pause();
      sendAimKeepalive(now);
      if (player.items && player.items.length && (!player._castKeepaliveAt || now - player._castKeepaliveAt >= 10000)) {
        player._castKeepaliveAt = now;
        window.__castSend({ type: "heartbeat", state: guard.shown ? guard.state : "PLAYING" });
      }
      if (!guard.tick()) return;
      window.__castSend({ type: "heartbeat", state: guard.state });
    }, 1000);
    sendLimits();
    setTimeout(sendLimits, 500);
    setTimeout(sendLimits, 1500);
  </script>
</body>
</html>
